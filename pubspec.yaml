name: pennypal
description: PennyPal student personal finance application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  video_player: ^2.14.0
  flutter_local_notifications: ^19.5.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/pennypal_logo.png
    - assets/branding/pennypal_logo_192.png
